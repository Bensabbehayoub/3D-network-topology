<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Simulateur pédagogique de protocoles réseau dans une topologie 3D (WebXR).">
  <meta name="theme-color" content="#101418">
  <title>3D Network Topology</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    Points de montage (contrat du pôle ui, voir src/ui/index.js → MOUNT_POINTS).
    Chaque élément à id est un conteneur vide rempli par son module : ne pas y écrire de contenu ici.
      #scene            canvas 3D (pôle render, Aziz)
      #controls         lecture, pause, pas à pas, vitesse, réinitialisation (ui)
      #scenario-picker  choix du scénario (ui)
      #inspector        équipement sélectionné, puis champs du paquet sélectionné (ui)
      #explanations     explication de l'étape + journal des messages (ui)
      #recommendations  diagnostic du réseau : problèmes, causes, corrections (ui, phase 6)
      #xr-slot          bouton « Entrer en VR » (pôle xr, Ayoub)
      #install-slot     bouton « Installer » et badge « Hors ligne » (ui)
      #mode-slot        bascule « Explorer | Construire » (ui, phase 7)
      #editor           éditeur de topologie du mode « Construire » (ui, phase 7)
  -->
  <header class="app-header">
    <h1 class="app-title">3D Network Topology</h1>
    <div id="mode-slot" class="slot"></div>
    <div id="scenario-picker" class="slot slot-picker"></div>
    <div class="header-actions">
      <div id="install-slot" class="slot"></div>
      <div id="xr-slot" class="slot"></div>
    </div>
  </header>

  <main class="app-main">
    <div id="scene" class="scene" role="region" aria-label="Topologie réseau en 3D"></div>
    <div id="controls" class="slot slot-controls" role="toolbar" aria-label="Commandes de la simulation"></div>
  </main>

  <aside class="app-side" aria-label="Analyse pédagogique">
    <section class="panel panel-inspector" aria-labelledby="inspector-title">
      <h2 id="inspector-title" class="panel-title">Inspecteur</h2>
      <div id="inspector" class="slot panel-body"></div>
    </section>
    <section class="panel panel-editor" aria-labelledby="editor-title">
      <h2 id="editor-title" class="panel-title">Éditeur de topologie</h2>
      <div id="editor" class="slot panel-body"></div>
    </section>
    <section class="panel panel-tabs" aria-label="Explications et recommandations">
      <div class="panel-tablist" role="tablist" aria-label="Contenu du panneau">
        <button type="button" class="panel-tab" role="tab" id="tab-explanations" aria-controls="explanations" aria-selected="true">Explications</button>
        <button type="button" class="panel-tab" role="tab" id="tab-recommendations" aria-controls="recommendations" aria-selected="false" tabindex="-1">Recommandations <span class="tab-badge" id="recommendations-badge" hidden></span></button>
      </div>
      <div id="explanations" class="slot panel-body" role="tabpanel" aria-labelledby="tab-explanations" aria-live="polite"></div>
      <div id="recommendations" class="slot panel-body" role="tabpanel" aria-labelledby="tab-recommendations" hidden></div>
    </section>
  </aside>

  <noscript>
    <p class="noscript">Cette application a besoin de JavaScript pour afficher la topologie et simuler les protocoles.</p>
  </noscript>

  <script type="module" src="main.js"></script>
</body>
</html>
